# Prometheus for local development: scrapes the API running on your machine (npm start / npm run dev)
# and evaluates the alert rules. UI at http://localhost:9090 (Alerts tab shows what's firing).
#
# In production, point the target at your instances, set METRICS_TOKEN on the API and add it here
# (authorization.credentials), and add an alertmanager to route firing alerts to email/Slack/PagerDuty.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: irctc-api
    metrics_path: /metrics
    static_configs:
      # The API runs on the host, not in Docker; host.docker.internal is the host as seen from a container.
      - targets: ["host.docker.internal:3000"]
