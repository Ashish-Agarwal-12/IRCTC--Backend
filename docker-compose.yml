services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: irctc
      POSTGRES_PASSWORD: irctc
      POSTGRES_DB: irctc
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    # Fake SMTP server for development: catches every email; view them at http://localhost:8025
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
  prometheus:
    # Scrapes the API on your machine and evaluates ops/prometheus/alerts.yml. UI at http://localhost:9090
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes: ["./ops/prometheus:/etc/prometheus:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"] # Linux; Docker Desktop has it built in
volumes:
  pgdata: